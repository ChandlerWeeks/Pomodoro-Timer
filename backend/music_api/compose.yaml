services:
  backend:
    build:
      context: .
    init: true
    environment:
      NODE_ENV: development
      PORT: "3000"
    command: ["node", "--watch", "server.js"]
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./server.js:/home/node/app/server.js:ro
      - ./controllers:/home/node/app/controllers:ro
      - ./routes:/home/node/app/routes:ro
      - ./lib:/home/node/app/lib:ro
      - type: bind
        source: ${MUSIC_DATA_DIR:-./data}
        target: /home/node/app/data
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/playlists').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
