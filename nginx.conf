server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /.well-known/focal-deployment.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
