name: Deploy Pomodoro

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pomodoro-production
  cancel-in-progress: false

jobs:
  check:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: |
            frontend-client/package-lock.json
            backend/music_api/package-lock.json
      - run: npm ci --prefix frontend-client
      - run: npm --prefix frontend-client run build
      - run: npm ci --prefix backend/music_api
      - run: npm --prefix backend/music_api test
      - name: Validate production configuration
        run: |
          bash -n deploy/watch-production.sh
          bash -n deploy/install-watcher.sh
          docker compose -f compose.production.yaml config --quiet

  deploy:
    name: Deploy to production
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Publish the tested commit for the server
        run: git push origin HEAD:refs/heads/production

      - name: Wait for the live site to confirm deployment
        shell: bash
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 100); do
            deployed_sha="$(curl --fail --silent --show-error \
              --connect-timeout 5 --max-time 10 \
              -H 'Cache-Control: no-cache' \
              "https://usefocal.net/.well-known/focal-deployment.json?run=${GITHUB_RUN_ID}&attempt=${attempt}" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])' \
              || true)"
            if [ "$deployed_sha" = "$DEPLOY_SHA" ]; then
              curl --fail --silent --show-error --max-time 30 \
                https://usefocal.net/ > /dev/null
              curl --fail --silent --show-error --max-time 30 \
                https://usefocal.net/api/playlists/ > /dev/null
              echo "Production is serving $DEPLOY_SHA"
              exit 0
            fi
            echo "Waiting for the server to deploy $DEPLOY_SHA ($attempt/100)"
            sleep 10
          done
          echo 'Deployment was not confirmed. Check: journalctl --user -u focal-deploy.service'
          exit 1
